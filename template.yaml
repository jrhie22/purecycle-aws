AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pure-Cycle Ghost Fiber Analyzer - Lambda + HTTP API

Parameters:
  S3BucketName:
    Type: String
    Description: Existing S3 bucket name (created manually in step 1)
  TableName:
    Type: String
    Description: Existing DynamoDB table name (created manually in step 1)
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0

Globals:
  Function:
    Timeout: 60
    Runtime: python3.12
    MemorySize: 512

Resources:
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref S3BucketName
          TABLE_NAME: !Ref TableName
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - S3WritePolicy:
            BucketName: !Ref S3BucketName
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: "*"
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            Path: /analyze
            Method: post

Outputs:
  ApiUrl:
    Description: Full invoke URL to put in .env as API_GATEWAY_URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/analyze"
